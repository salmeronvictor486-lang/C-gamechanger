name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Tests (intérprete comparado con gcc y todas las lecciones)
        run: npm test
      - name: Compilar la web
        run: npm run build
